<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رؤساء الفروع والأقسام</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0891b2">
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f1f5f9; margin: 0; color: #0f172a; }
  .container { max-width: 640px; margin: 0 auto; padding: 20px; }
  .card { background: #fff; border-radius: 14px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 20px; }
  h2 { font-size: 16px; margin-top: 0; }
  input, textarea, select {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1;
    margin-bottom: 10px; font-size: 14px; font-family: inherit;
  }
  button {
    padding: 10px 18px; border-radius: 8px; border: none; background: #0891b2;
    color: #fff; font-weight: bold; cursor: pointer; font-size: 14px;
  }
  button.secondary { background: #64748b; }
  .error { color: #dc2626; font-size: 13px; }
  .pin-box { background: #ecfeff; border: 1px solid #67e8f9; padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  #login-view { max-width: 400px; margin: 60px auto; }
  .msg { background: #f8fafc; border-radius: 10px; padding: 14px; margin-bottom: 10px; border-right: 4px solid #0891b2; }
  .msg.unread { border-right-color: #f59e0b; }
  .msg h3 { margin: 0 0 6px 0; font-size: 15px; }
  .msg p { margin: 0; color: #475569; font-size: 14px; }
  .msg time { color: #94a3b8; font-size: 12px; display:block; margin-top:6px; }
  .msg a.attach { display:inline-block; margin-top:8px; font-size:13px; color:#0891b2; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button { flex:1; background:#e2e8f0; color:#0f172a; }
  .tabs button.active { background:#0891b2; color:#fff; }
  .empty { text-align:center; color:#94a3b8; padding: 20px; }
</style>
</head>
<body>

<div id="login-view" class="container">
  <div class="card">
    <h1>🏢 رؤساء الفروع والأقسام</h1>
    <input id="b-username" placeholder="اسم المستخدم">
    <input id="b-password" type="password" placeholder="كلمة المرور">
    <button style="width:100%" onclick="branchLogin()">دخول</button>
    <div id="login-err" class="error"></div>
  </div>
</div>

<div id="app-view" class="container" style="display:none;">
  <div class="top">
    <h1 id="head-name">-</h1>
    <button class="secondary" onclick="logout()">خروج</button>
  </div>

  <div class="card">
    <h2>✉️ إرسال رسالة للمدرسين</h2>
    <select id="m-department">
      <option value="">بدون تصنيف فرع/قسم</option>
    </select>
    <select id="m-target">
      <option value="">لكل المدرسين</option>
    </select>
    <input id="m-title" placeholder="عنوان الرسالة">
    <textarea id="m-body" rows="3" placeholder="نص الرسالة"></textarea>
    <input id="m-attachment" type="file">
    <button onclick="sendMessage()">إرسال</button>
    <div id="send-status"></div>
  </div>

  <div class="tabs">
    <button id="tab-inbox" class="active" onclick="switchTab('inbox')">📥 الوارد من الإدارة</button>
    <button id="tab-sent" onclick="switchTab('sent')">📤 رسائلي المرسلة</button>
  </div>

  <div class="card" id="inbox-card">
    <div id="inbox-list"></div>
  </div>
  <div class="card" id="sent-card" style="display:none;">
    <div id="sent-list"></div>
  </div>

  <div class="card">
    <h2>🔑 تغيير كلمة المرور</h2>
    <input id="cp-current" type="password" placeholder="كلمة المرور الحالية">
    <input id="cp-new" type="password" placeholder="كلمة المرور الجديدة">
    <input id="cp-confirm" type="password" placeholder="تأكيد كلمة المرور الجديدة">
    <button onclick="changePassword()">حفظ</button>
    <div id="cp-status"></div>
  </div>
</div>

<script>
let token = localStorage.getItem('branch_token');
let headName = localStorage.getItem('branch_name');
if (token) showApp();

async function branchLogin() {
  const username = document.getElementById('b-username').value.trim();
  const password = document.getElementById('b-password').value;
  const err = document.getElementById('login-err');
  err.textContent = '';
  const res = await fetch('/api/branch/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();
  if (!res.ok) { err.textContent = data.error; return; }
  token = data.token; headName = data.name;
  localStorage.setItem('branch_token', token);
  localStorage.setItem('branch_name', headName);
  showApp();
}

function logout() {
  localStorage.removeItem('branch_token');
  localStorage.removeItem('branch_name');
  location.reload();
}

function authHeaders(extra) {
  return Object.assign({ Authorization: 'Bearer ' + token }, extra || {});
}

async function showApp() {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app-view').style.display = 'block';
  document.getElementById('head-name').textContent = 'أهلاً، ' + headName;
  await registerPush();
  await loadDepartments();
  await loadTeachers();
  await loadInbox();
  await loadSent();
  setInterval(loadInbox, 20000);
}

async function loadDepartments() {
  const res = await fetch('/api/branch/departments', { headers: authHeaders() });
  const depts = await res.json();
  const select = document.getElementById('m-department');
  select.innerHTML = '<option value="">بدون تصنيف فرع/قسم</option>' +
    depts.map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('');
}

async function loadTeachers() {
  const res = await fetch('/api/branch/teachers', { headers: authHeaders() });
  if (res.status === 401) return logout();
  const teachers = await res.json();
  const select = document.getElementById('m-target');
  select.innerHTML = '<option value="">لكل المدرسين</option>' +
    teachers.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
}

function switchTab(tab) {
  document.getElementById('tab-inbox').classList.toggle('active', tab === 'inbox');
  document.getElementById('tab-sent').classList.toggle('active', tab === 'sent');
  document.getElementById('inbox-card').style.display = tab === 'inbox' ? 'block' : 'none';
  document.getElementById('sent-card').style.display = tab === 'sent' ? 'block' : 'none';
}

async function loadInbox() {
  const res = await fetch('/api/branch/messages', { headers: authHeaders() });
  const messages = await res.json();
  const list = document.getElementById('inbox-list');
  if (messages.length === 0) { list.innerHTML = '<div class="empty">مفيش رسائل واردة من الإدارة لسه</div>'; return; }
  list.innerHTML = messages.map(m => `
    <div class="msg ${m.read_at ? '' : 'unread'}" onclick="markRead(${m.id}, this)">
      <h3>${escapeHtml(m.title)}</h3>
      <p>${escapeHtml(m.body)}</p>
      ${m.attachment_path ? `<a class="attach" href="${m.attachment_path}" target="_blank" onclick="event.stopPropagation()">📎 ${escapeHtml(m.attachment_name || 'مرفق')}</a>` : ''}
      <time>${new Date(m.created_at).toLocaleString('ar-EG')}${m.department_name ? ' · ' + escapeHtml(m.department_name) : ''}</time>
    </div>
  `).join('');
}

async function markRead(id, el) {
  el.classList.remove('unread');
  await fetch(`/api/branch/messages/${id}/read`, { method: 'POST', headers: authHeaders() });
}

async function loadSent() {
  const res = await fetch('/api/branch/sent-messages', { headers: authHeaders() });
  const messages = await res.json();
  const list = document.getElementById('sent-list');
  if (messages.length === 0) { list.innerHTML = '<div class="empty">لسه ما بعتش أي رسائل</div>'; return; }
  list.innerHTML = messages.map(m => `
    <div class="msg">
      <h3>${escapeHtml(m.title)}</h3>
      <p>${escapeHtml(m.body)}</p>
      ${m.attachment_path ? `<a class="attach" href="${m.attachment_path}" target="_blank">📎 ${escapeHtml(m.attachment_name || 'مرفق')}</a>` : ''}
      <time>${new Date(m.created_at).toLocaleString('ar-EG')} · لـ ${m.target_name ? escapeHtml(m.target_name) : 'كل المدرسين'}${m.department_name ? ' · ' + escapeHtml(m.department_name) : ''}</time>
    </div>
  `).join('');
}

async function sendMessage() {
  const title = document.getElementById('m-title').value.trim();
  const body = document.getElementById('m-body').value.trim();
  const target = document.getElementById('m-target').value;
  const department = document.getElementById('m-department').value;
  const fileInput = document.getElementById('m-attachment');
  const status = document.getElementById('send-status');
  if (!title || !body) { status.innerHTML = '<div class="error">اكتب العنوان والنص</div>'; return; }

  const formData = new FormData();
  formData.append('title', title);
  formData.append('body', body);
  if (target) formData.append('target_teacher_id', target);
  if (department) formData.append('department_id', department);
  if (fileInput.files[0]) formData.append('attachment', fileInput.files[0]);

  const res = await fetch('/api/branch/messages', {
    method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: formData
  });
  const data = await res.json();
  if (!res.ok) { status.innerHTML = `<div class="error">${data.error}</div>`; return; }

  status.innerHTML = `<div class="pin-box">✅ اتبعتت. وصل إشعار فوري لـ ${data.notified} من ${data.totalTeachers} مدرس.</div>`;
  document.getElementById('m-title').value = '';
  document.getElementById('m-body').value = '';
  fileInput.value = '';
  loadSent();
}

async function changePassword() {
  const current_password = document.getElementById('cp-current').value;
  const new_password = document.getElementById('cp-new').value;
  const confirm_password = document.getElementById('cp-confirm').value;
  const status = document.getElementById('cp-status');
  status.innerHTML = '';
  if (!current_password || !new_password || !confirm_password) { status.innerHTML = '<div class="error">املأ كل الحقول</div>'; return; }
  if (new_password !== confirm_password) { status.innerHTML = '<div class="error">كلمة المرور الجديدة وتأكيدها مش متطابقين</div>'; return; }

  const res = await fetch('/api/branch/change-password', {
    method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ current_password, new_password })
  });
  const data = await res.json();
  if (!res.ok) { status.innerHTML = `<div class="error">${data.error}</div>`; return; }
  status.innerHTML = '<div class="pin-box">✅ اتغيرت كلمة المرور بنجاح.</div>';
  document.getElementById('cp-current').value = '';
  document.getElementById('cp-new').value = '';
  document.getElementById('cp-confirm').value = '';
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function registerPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return;
    const keyRes = await fetch('/api/vapid-public-key');
    const { key } = await keyRes.json();
    if (!key) return;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(key) });
    await fetch('/api/branch/subscribe', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(sub)
    });
  } catch (e) { console.warn('تعذر تفعيل الإشعارات:', e); }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
